<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamEdge - Student Assessment Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
   <!-- Student Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-extrabold text-primary d-flex align-items-center gap-2 fs-3" href="dashboard.html">
        <span class="badge bg-primary text-white rounded-3 px-2 py-1 fs-5">EE</span>
        <span>Exam<span class="text-warning">Edge</span></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <span class="small text-muted d-none d-md-inline" id="userGreeting">Welcome, Student</span>
        <button onclick="logout()" class="btn btn-outline-danger btn-sm fw-semibold">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h3 class="fw-bold m-0">Student Assessment Hub</h3>
        <p class="text-muted small m-0">Select an exam to begin your timed mock test</p>
      </div>
      <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill">
        Active Session
      </span>
    </div>

    <!-- Quiz Grid Container -->
    <div id="quizContainer" class="row g-4">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Loading test series from database...</p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
