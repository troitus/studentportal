<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamEdge - Student Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 420px; width: 100%;">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <a href="index.html" class="navbar-brand fw-extrabold text-primary d-inline-flex align-items-center gap-2 fs-3 mb-2">
          <span class="badge bg-primary text-white rounded-3 px-2 py-1 fs-5">EE</span>
          <span>Exam<span class="text-warning">Edge</span></span>
        </a>
        <h4 class="fw-bold mt-2">Student Portal Sign In</h4>
        <p class="text-muted small">Enter your credentials to access your tests</p>
      </div>

      <div id="alertBox"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold small">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold small">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">
          Sign In
        </button>
      </form>

      <div class="text-center mt-4 small text-muted">
        Don't have an account? <a href="register.html" class="text-primary text-decoration-none fw-semibold">Register here</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
