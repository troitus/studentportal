<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamEdge - Examination Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4" style="max-width: 820px;">
    
    <!-- Exam Header with Live Countdown Timer -->
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 rounded bg-body-tertiary border shadow-sm">
      <div>
        <h5 id="quizTitle" class="fw-bold m-0 text-primary">Loading Exam...</h5>
        <span id="questionProgress" class="small text-muted">Question 0 of 0</span>
      </div>
      <div id="timer" class="badge bg-danger fs-5 px-3 py-2 shadow-sm">
        <i class="bi bi-clock me-1"></i> 00:00
      </div>
    </div>

    <!-- Question Box -->
    <div id="quizBox" class="card border-0 shadow p-4 rounded-4">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Preparing examination paper...</p>
      </div>
    </div>

    <!-- Result / Evaluation Box (Hidden initially) -->
    <div id="resultBox" class="card border-0 shadow p-4 rounded-4 d-none"></div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
